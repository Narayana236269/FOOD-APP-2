<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Foodie | Shopping Cart</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="logo">Foodie</a>

      <div class="nav-links">
        <a href="index.html">Home</a>

        <a href="cart.html">
          Cart <span class="cart-count" id="navCartCount">0</span>
        </a>
      </div>
    </nav>

    <!-- CART PAGE -->
    <main class="container">
      <h2 class="section-title">My Shopping Cart</h2>

      <!-- EMPTY CART MESSAGE -->
      <div id="emptyCart" class="empty-message">
        <h3>Your cart is empty!</h3>
        <p>Please add some delicious food.</p>

        <a href="index.html">
          <button class="btn btn-primary">Continue Shopping</button>
        </a>
      </div>

      <!-- CART ITEMS -->
      <div id="cartItems"></div>

      <!-- CART SUMMARY -->
      <div id="cartSummary" class="cart-summary">
        <p>Subtotal: <strong id="subtotal">₹0</strong></p>

        <p>Delivery Charge: <strong id="delivery">₹40</strong></p>

        <p>Discount: <strong id="discount">₹0</strong></p>

        <h3>Total: <span id="total">₹0</span></h3>

        <div class="cart-actions">
          <button id="clearCart" class="btn btn-danger">Clear Cart</button>

          <button id="checkoutBtn" class="btn btn-success">
            Proceed to Checkout
          </button>

          <a href="index.html">
            <button class="btn btn-secondary">Continue Shopping</button>
          </a>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <p>© 2026 Foodie Restaurant. All Rights Reserved.</p>
    </footer>

    <!-- CART LOGIC -->
    <script src="cart.js"></script>
  </body>
</html>
